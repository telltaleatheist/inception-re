name: package check
# Builds and smoke-tests the packages (tools/build_package.py,
# docs/RELEASING.md) on each platform, with no game files: the saves'
# tests that need none, and --help and --status from the packaged program.
# Uploads the results as workflow artifacts only. Nothing here tags,
# releases or publishes: a release's packages are made by dispatching it
# with the tag as the label, then published by hand (docs/RELEASING.md).
on:
  workflow_dispatch:
    inputs:
      label:
        description: "The packages' label: empty for <run number>-test, a release tag chi-vX.Y.Z, or a name ending -test"
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'extern/**'
      - '.github/workflows/package-check.yml'
permissions:
  contents: read
concurrency:
  # A labelled run (a release's) is never cancelled by a push's run.
  group: package-check-${{ github.ref }}-${{ inputs.label }}
  cancel-in-progress: true
env:
  # SDL 3.4.12, as docs/RELEASING.md pins it.
  SDL_COMMIT: f87239e71e42da91ca317a12eefb82cfbf3393eb
  # The input reaches the jobs only as this variable, never inside a script.
  LABEL: ${{ inputs.label || format('{0}-test', github.run_number) }}
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: The label is a release tag or a test's
        shell: bash
        run: |
          if [[ ! "$LABEL" =~ ^chi-v[0-9]+\.[0-9]+\.[0-9]+$ && ! "$LABEL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*-test$ ]]; then
            echo "::error::The label must be chi-vX.Y.Z or end in -test"
            exit 1
          fi
          echo "label: $LABEL"
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: ${{ env.SDL_COMMIT }}
          path: build-deps/SDL
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Desktop and audio development libraries (for SDL)
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config libasound2-dev libpulse-dev libx11-dev \
            libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libudev-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libpipewire-0.3-dev
      - name: The packaging's unit tests
        run: python -I -m unittest discover -s tools -p test_build_package.py -v
      - name: The static archive libraries, from pinned sources
        run: tools/deps/build_archive.sh linux
      - name: The AppImage tools, pinned releases checked by SHA-256
        run: |
          mkdir -p build-deps/appimage
          cd build-deps/appimage
          curl -fsSL -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -fsSL -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          printf '%s\n' \
            'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage' \
            'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage' \
            | sha256sum -c -
          chmod +x linuxdeploy-x86_64.AppImage appimagetool-x86_64.AppImage
      - name: Package and smoke-test (the tarball and the AppImage)
        run: >-
          python -I tools/build_package.py --sdl build-deps/SDL --label "$LABEL" --installer
          --appimage-tools build-deps/appimage
      - uses: actions/upload-artifact@v4
        with:
          name: package-check-linux
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.sha256

  windows:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: The label is a release tag or a test's
        shell: bash
        run: |
          if [[ ! "$LABEL" =~ ^chi-v[0-9]+\.[0-9]+\.[0-9]+$ && ! "$LABEL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*-test$ ]]; then
            echo "::error::The label must be chi-vX.Y.Z or end in -test"
            exit 1
          fi
          echo "label: $LABEL"
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: ${{ env.SDL_COMMIT }}
          path: build-deps/SDL
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The packaging's unit tests
        run: python -I -m unittest discover -s tools -p test_build_package.py -v
      - name: The static archive libraries, from pinned sources (clang-cl)
        shell: cmd
        timeout-minutes: 20
        run: tools\windows\build_deps_archive.cmd
      - name: Package, the installer, and smoke-test
        shell: bash
        run: python -I tools/build_package.py --sdl build-deps/SDL --label "$LABEL" --installer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-check-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256

  mac:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: The label is a release tag or a test's
        shell: bash
        run: |
          if [[ ! "$LABEL" =~ ^chi-v[0-9]+\.[0-9]+\.[0-9]+$ && ! "$LABEL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*-test$ ]]; then
            echo "::error::The label must be chi-vX.Y.Z or end in -test"
            exit 1
          fi
          echo "label: $LABEL"
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: ${{ env.SDL_COMMIT }}
          path: build-deps/SDL
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The packaging's unit tests
        run: python -I -m unittest discover -s tools -p test_build_package.py -v
      - name: The static archive libraries, universal, from pinned sources
        run: tools/deps/build_archive.sh mac
      - name: Package (universal) and smoke-test
        run: python -I tools/build_package.py --sdl build-deps/SDL --label "$LABEL"
      - uses: actions/upload-artifact@v4
        with:
          name: package-check-mac
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.sha256
